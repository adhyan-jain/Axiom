# Slice 1: Postgres + Redis wired into apps/web (Prisma) via DATABASE_URL/REDIS_URL.
#
# Host ports are remapped off the Postgres/Redis defaults (5433/6380 instead of 5432/6379)
# because this dev machine already runs other unrelated Postgres/Redis instances on the
# default ports — see docs/DECISIONS.md. Container-internal ports are untouched, so this is
# purely a host-side remap; update DATABASE_URL/REDIS_URL in .env to match if you change
# these.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom
    ports:
      - "5433:5432"
    volumes:
      - axiom_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - axiom_redis_data:/data

volumes:
  axiom_postgres_data:
  axiom_redis_data:
