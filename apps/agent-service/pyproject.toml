[project]
name = "axiom-agent-service"
version = "0.1.0"
description = "Axiom agent-service: stateless Python FastAPI service for multi-agent orchestration (Strands Agents). Calls back into apps/web's internal API for all reads/writes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "strands-agents>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "anthropic>=1.5.0",
    "boto3>=1.43.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: real external API call (e.g. live Anthropic request); skips gracefully if credentials are absent.",
]
