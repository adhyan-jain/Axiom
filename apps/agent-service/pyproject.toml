[project]
name = "axiom-agent-service"
version = "0.1.0"
description = "Axiom agent-service: stateless Python FastAPI service for multi-agent orchestration (Strands Agents). Calls back into apps/web's internal API for all reads/writes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
